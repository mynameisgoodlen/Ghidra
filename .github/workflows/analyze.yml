          cat > work/MANIFEST.sha <<'MCRE_EOF'
          bcfe24f5122af52aac7fa8546d476dd3e91d16a33e4ba1629a3c9d08c9206174  work/xref_scan.py
          c4af031164efb63d4cb46df909529b60e7ec80ed3747bf4ba4933ab0be18b286  work/rtti_chain.py
          bf77a1adde0851bd695b609a02c75b877dd4d4458bad8f1b11cd342b66819755  work/DecompileCandidates.java
          7a8d4a95b713cd67731a0990151c092acf8aab34f6a68bde4e7db31ba9e42579  work/strings_map.sh
          31f546066d2d669f77fb13326e046b4443e8b64438a14ee72d88b9fd9cfbeb8e  work/seeds.psv
          MCRE_EOF
          sha256sum -c work/MANIFEST.sha || { echo "A file was damaged when pasting analyze.yml - paste it again completely"; exit 1; }
          sed 's/|/\t/g' work/seeds.psv > work/seeds.tsv
          wc -l work/seeds.tsv

      - name: Find and unpack the library
        run: |
          set -eu
          EXPECT_SHA="${EXPECT_SHA:-629c94e3d8a67f6f6de8296e9ebe9739cddbe4adc7e64ff699f32b289c82685b}"
          command -v 7z >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full; }
          echo "7z-looking files in the repo:"
          find . -path ./.git -prune -o -type f \( -name '*.7z' -o -name '*.7z.*' \) -print | sort
          FIRST="$(find . -path ./.git -prune -o -type f -name '*.7z.001' -print | sort | head -n 1)"
          if [ -z "$FIRST" ]; then FIRST="$(find . -path ./.git -prune -o -type f -name '*.7z' -print | sort | head -n 1)"; fi
          if [ -z "$FIRST" ]; then
            echo "No .7z / .7z.001 file found. Files over 1 MB in the repo:"
            find . -path ./.git -prune -o -type f -size +1M -print | head -n 50
            echo "Tell me which file is the FIRST part of the library."
            exit 1
          fi
          echo "first part: $FIRST ($(head -c 7 "$FIRST" | od -An -c | tr -d ' ' ))"
          mkdir -p work/lib
          7z x -y -owork/lib "$FIRST" > work/7z.log 2>&1 || { tail -n 20 work/7z.log; echo "7z failed"; exit 1; }
          LIB="$(find work/lib -type f -name 'libminecraftpe.so' | head -n 1)"
          if [ -z "$LIB" ]; then LIB="$(find work/lib -type f -printf '%s %p\n' | sort -rn | head -n 1 | cut -d' ' -f2-)"; fi
          [ -n "$LIB" ] || { echo "nothing came out of the archive"; exit 1; }
          ls -la "$LIB"
          echo "$EXPECT_SHA  $LIB" | sha256sum -c - || { echo "This is not the library build we expect (1.26.62.1)"; exit 1; }
          readelf -n "$LIB" | grep -i "build id" || true
          echo "LIB=$PWD/$LIB" >> "$GITHUB_ENV"

      - name: Strings census
        run: |
          set -u
          mkdir -p out/strings
          bash work/strings_map.sh "$LIB" out/strings || true
          strings -a -t x -n 8 "$LIB" > work/all_strings.txt
          wc -l work/all_strings.txt
          grep '::' work/all_strings.txt | grep -E 'queueRender|setupViewArea|RenderEntit|ActorRender|EntityRender|Frustum|frustum|Cull|cull|Occlu|ViewArea|ViewCone|BlockActor' | cut -c1-300 | head -n 8000 > out/strings/census_cull.txt || true
          wc -l out/strings/census_cull.txt

      - name: RTTI chain of the chunk-build lambdas
        continue-on-error: true
        timeout-minutes: 40
        run: |
          set -eu
          python3 -m venv .venv
          . .venv/bin/activate
          pip install -q numpy
          python work/rtti_chain.py "$LIB" out/rtti 2>&1 | tee out/rtti.log

      - name: Build the decompile list
        run: |
          set -eu
          {
            sed -n '1,11p' work/seeds.tsv
            if [ -f out/rtti/rtti_candidates.tsv ]; then tail -n +2 out/rtti/rtti_candidates.tsv; fi
            sed -n '12,$p' work/seeds.tsv
          } > work/candidates_all.tsv
          cp work/candidates_all.tsv out/
          wc -l work/candidates_all.tsv

      - name: JDK for Ghidra
        continue-on-error: true
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Ghidra - decompile the candidates
        continue-on-error: true
        timeout-minutes: 110
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          java -version 2>&1 | head -n 2
          URL="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                 https://api.github.com/repos/NationalSecurityAgency/ghidra/releases/latest \
                 | jq -r '.assets[].browser_download_url' | grep -E 'ghidra_[0-9.]+_PUBLIC_[0-9]+\.zip$' | head -n 1)"
          echo "Ghidra: $URL"
          curl -fsSL -o ghidra.zip "$URL"
          mkdir -p gh && unzip -q ghidra.zip -d gh
          GH="$(ls -d gh/ghidra_*_PUBLIC | head -n 1)"
          grep -E 'application.(version|java.min)' "$GH/Ghidra/application.properties" || true
          MEM_G="$(awk '/MemTotal/ { g=int($2*0.75/1048576); if (g<4) g=4; print g }' /proc/meminfo)"
          sed -i "s/^MAXMEM=.*/MAXMEM=${MEM_G}G/" "$GH/support/analyzeHeadless"
          grep -n '^MAXMEM' "$GH/support/analyzeHeadless" || echo "WARNING: no MAXMEM line in analyzeHeadless"
          mkdir -p ghproj out/dec
          "$GH/support/analyzeHeadless" "$PWD/ghproj" mc -import "$LIB" -overwrite -noanalysis \
              -scriptPath "$PWD/work" \
              -postScript DecompileCandidates.java "$PWD/out/dec" "$PWD/work/candidates_all.tsv" \
              2>&1 | tee out/ghidra.log | tail -n 60

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcre-results
          path: out/
          if-no-files-found: warn
