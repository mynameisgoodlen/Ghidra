name: analyze-libminecraftpe

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: analyze
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild library from parts
        run: |
          sudo apt-get install -y p7zip-full >/dev/null
          ls -la
          first=$(ls ./*.7z.001 parts/*.7z.001 2>/dev/null | head -n 1 || true)
          if [ -n "$first" ]; then
            7z e -y -o. "$first" >/dev/null
          elif ls parts/part_* >/dev/null 2>&1; then
            cat parts/part_* | xz -d > libminecraftpe.so
          else
            z=$(ls ./*.zip parts/*.zip 2>/dev/null | head -n 1 || true)
            [ -n "$z" ] || { echo "No library parts found"; exit 1; }
            unzip -o "$z" || { zip -s 0 "$z" --out joined.zip && unzip -o joined.zip; }
          fi
          found=$(find . -name libminecraftpe.so -not -path './libminecraftpe.so' | head -n 1 || true)
          if [ -n "$found" ]; then mv "$found" ./libminecraftpe.so; fi
          ls -la libminecraftpe.so
          file libminecraftpe.so
          sha=$(sha256sum libminecraftpe.so | cut -d' ' -f1)
          echo "sha256: $sha"
          if [ "$sha" = "629c94e3d8a67f6f6de8296e9ebe9739cddbe4adc7e64ff699f32b289c82685b" ]; then echo "MATCH: expected build"; else echo "MISMATCH: different build than expected"; fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Find code that uses the target strings
        run: |
          python -m pip install -q numpy
          mkdir -p out/xref
          { file libminecraftpe.so; readelf -n libminecraftpe.so | grep -i "build id"; } > out/xref/info.txt 2>&1 || true
          python scripts/xref_scan.py libminecraftpe.so targets.tsv out/xref

      - name: Upload xref results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xref-results
          path: out/xref
          if-no-files-found: ignore

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Download latest Ghidra
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p tools dl
          gh release download -R NationalSecurityAgency/ghidra -p 'ghidra_*_PUBLIC_*.zip' -D dl --clobber
          unzip -q dl/ghidra_*.zip -d tools
          echo "GHIDRA_HOME=$(ls -d "$PWD"/tools/ghidra_*)" >> "$GITHUB_ENV"

      - name: Ghidra decompile of the found functions (no full analysis)
        continue-on-error: true
        run: |
          for f in "$GHIDRA_HOME/support/analyzeHeadless" "$GHIDRA_HOME/support/launch.properties"; do
            sed -i -E 's/^(MAXMEM=).*/\15G/' "$f" || true
          done
          mkdir -p out/ghidra proj
          "$GHIDRA_HOME/support/analyzeHeadless" proj mc \
            -import libminecraftpe.so -overwrite -noanalysis \
            -scriptPath "$PWD/ghidra_scripts" \
            -postScript DecompileCandidates.java "$PWD/out/ghidra" "$PWD/out/xref/candidates.tsv" \
            2>&1 | grep -v "ELF Relocation" | tee out/ghidra/headless.log

      - name: Upload Ghidra results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghidra-results
          path: out/ghidra
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          {
            echo '## xref summary'; echo '```'; cat out/xref/summary.txt 2>/dev/null || echo "scan did not run"; echo '```'
            echo '## decompiled'; echo '```'; head -n 80 out/ghidra/decompiled_index.tsv 2>/dev/null || echo "none (see headless.log)"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
