          #!/usr/bin/env python3
          """
          rtti_chain.py <lib.so> <outdir>

          Follows the C++ RTTI chain of the lambdas / std::function objects that belong to the
          chunk-build code, without whole-program analysis:

            mangled name string -> typeinfo (word at typeinfo+4 == string address)
                                -> vtable   (word == typeinfo address, right after offset-to-top 0)
                                -> slots    (function pointers that follow the typeinfo pointer)
                                -> code that loads the vtable pointer = the code that BUILDS the object

          Outputs (outdir): rtti_names.txt  rtti_chain.txt  rtti_candidates.tsv
          Needs xref_scan.py next to it (re-uses its exact ARM/Thumb pc-relative scanner).
          """
          import mmap
          import os
          import re
          import struct
          import sys

          import numpy as np

          sys.path.insert(0, os.path.dirname(os.path.abspath(__file__)))
          import xref_scan as xs  # noqa: E402

          # identifiers (as they appear length-prefixed inside mangled names, e.g. "18scheduleChunkBuild")
          IDENTS = [
              "scheduleChunkBuild", "scheduleChunkSort", "startLevelBuildForThisFrame",
              "updatePerChunkFaceSortState", "_launchVisibilityRebuild", "_launchSubChunkInsertTasks",
              "setupViewArea", "queueRenderEntities",
          ]
          # name strings found earlier by hand (std::function lambdas $_2/$_3/$_4)
          SEEDS = [0x2229702, 0x22297f7, 0x222987e, 0x2229972, 0x2229a63, 0x2229b57]
          PER_IDENT_CAP = 60
          MAX_CAND = 70


          class Img:
              def __init__(self, path):
                  self.path = path
                  self.size = os.path.getsize(path)
                  self.loads = xs.read_loads(path) or [(0, 0, self.size)]
                  self.f = open(path, "rb")
                  self.mm = mmap.mmap(self.f.fileno(), 0, access=mmap.ACCESS_READ)

              def v2o(self, va):
                  for off, v, fsz in self.loads:
                      if v <= va < v + fsz:
                          return off + (va - v)
                  return None

              def o2v(self, off):
                  for o, v, fsz in self.loads:
                      if o <= off < o + fsz:
                          return v + (off - o)
                  return None

              def u32(self, va):
                  o = self.v2o(va)
                  if o is None or o + 4 > self.size:
                      return None
                  return struct.unpack_from("<I", self.mm, o)[0]

              def cstr(self, va, maxlen=600):
                  o = self.v2o(va)
                  if o is None:
                      return None
                  e = self.mm.find(b"\0", o, o + maxlen)
                  if e < 0:
                      e = min(self.size, o + maxlen)
                  return bytes(self.mm[o:e])


          PRINTABLE = re.compile(rb"^[\x20-\x7e]+$")


          def find_names(img, idents, seeds):
              """{string_vaddr: (bytes, ident)}"""
              found = {}
              for ident in idents:
                  pat = str(len(ident)).encode() + ident.encode()
                  pos, n = 0, 0
                  while n < PER_IDENT_CAP:
                      i = img.mm.find(pat, pos)
                      if i < 0:
                          break
                      pos = i + 1
                      if i > 0 and img.mm[i - 1:i].isdigit():
                          continue                        # "118scheduleChunkBuild" is not our identifier
                      lo = max(0, i - 2000)
                      s = img.mm.rfind(b"\0", lo, i) + 1
                      if s == 0 and lo > 0:
                          continue                        # no NUL within 2000 bytes: not a plain string
                      e = img.mm.find(b"\0", i)
                      if e < 0 or e - s < 8 or e - s > 4000:
                          continue
                      txt = bytes(img.mm[s:e])
                      if not PRINTABLE.match(txt):
                          continue
                      va = img.o2v(s)
                      if va is None:
                          continue
                      if va not in found:
                          found[va] = (txt, ident)
                          n += 1
              for sd in seeds:
                  o = img.v2o(sd)
                  if o is None:
                      continue
                  s = img.mm.rfind(b"\0", max(0, o - 2000), o) + 1
                  e = img.mm.find(b"\0", o)
                  if e < 0:
                      continue
                  for start in {o, s}:
                      txt = bytes(img.mm[start:e])
                      va = img.o2v(start)
                      if va is not None and PRINTABLE.match(txt) and va not in found:
                          found[va] = (txt, "seed")
              return found


          def read_slots(img, V, code_end, maxn=14):
              out = []
              for k in range(maxn):
                  v = img.u32(V + 4 * k)
                  if v is None or v == 0:
                      break
                  if not (0x100 <= (v & ~1) < code_end):
                      break
                  out.append(v)
              return out


          def main():
              if len(sys.argv) < 3:
                  print(__doc__)
                  sys.exit(2)
              lib, outdir = sys.argv[1], sys.argv[2]
              os.makedirs(outdir, exist_ok=True)
              img = Img(lib)
              seg_len = xs.first_load_len(lib, xs.read_loads(lib)) & ~3
              print("library %d bytes, first LOAD 0x%x" % (img.size, seg_len))

              names = find_names(img, IDENTS, SEEDS)
              print("name strings found: %d" % len(names))
              with open(os.path.join(outdir, "rtti_names.txt"), "w") as fh:
                  for va in sorted(names):
                      txt, ident = names[va]
                      fh.write("%08x  [%s]  %s\n" % (va, ident, txt.decode()[:400]))
              if not names:
                  open(os.path.join(outdir, "rtti_chain.txt"), "w").write("no name strings found\n")
                  with open(os.path.join(outdir, "rtti_candidates.tsv"), "w") as fc:
                      fc.write("name\tmode\tsite\tstart\tstring\ttarget\n")
                  return

              # ---- name -> typeinfo
              cells = xs.find_cells(lib, img.loads, np.array(sorted(names), dtype=np.int64))
              tinfo = {}                                  # typeinfo vaddr -> name vaddr
              for nva, cl in cells.items():
                  for c in cl:
                      t = c - 4
                      vp = img.u32(t)
                      if vp:
                          tinfo[t] = nva
              print("typeinfo objects: %d" % len(tinfo))

              # ---- typeinfo -> vtable (or other referrers)
              vt = []                                     # (idx, T, nva, V, slots)
              other = []                                  # (T, cell2, prev_word)
              if tinfo:
                  cells2 = xs.find_cells(lib, img.loads, np.array(sorted(tinfo), dtype=np.int64))
                  for T in sorted(cells2):
                      for c2 in cells2[T]:
                          prev = img.u32(c2 - 4)
                          if prev == 0:
                              V = c2 + 4
                              vt.append([len(vt) + 1, T, tinfo[T], V, read_slots(img, V, seg_len)])
                          else:
                              other.append((T, c2, prev))
              print("vtables: %d" % len(vt))

              # ---- vtable pointer -> code that builds the object
              ctor = {}                                   # V -> [(mode, site, [starts])]
              hm = np.memmap(lib, dtype="<u2", mode="r", shape=(seg_len // 2,))
              words = np.memmap(lib, dtype="<u4", mode="r", shape=(seg_len // 4,))
              vptrs = sorted({v[3] for v in vt})
              if vptrs:
                  seen = set()
                  for mode, site, s, kind in xs.scan_pcrel(hm, words, np.array(vptrs, dtype=np.int64), seg_len, ""):
                      if (mode, site, s) in seen:
                          continue
                      seen.add((mode, site, s))
                      st = xs.thumb_starts(hm, site) if mode == "T" else xs.arm_starts(words, site)
                      ctor.setdefault(s, []).append((mode, site, st, kind))
              print("vtable pointers loaded by code: %d of %d" % (len(ctor), len(vptrs)))

              # ---- report
              with open(os.path.join(outdir, "rtti_chain.txt"), "w") as fh:
                  fh.write("Slot meaning if this is a libc++ std::function '__func': 0,1 dtors | 2,3 clone | "
                           "4 destroy | 5 destroy_deallocate | 6 operator() = the lambda body | 7 target | 8 target_type\n\n")
                  for idx, T, nva, V, slots in vt:
                      txt, ident = names[nva]
                      fh.write("== #%d  [%s]\n   name   0x%08x  %s\n   typeinfo 0x%08x   vtable ptr 0x%08x\n" % (
                          idx, ident, nva, txt.decode()[:300], T, V))
                      fh.write("   slots: " + " ".join("%08x" % s for s in slots) + "\n")
                      for mode, site, st, kind in ctor.get(V, []):
                          fh.write("   BUILT BY code at 0x%08x (%s, %s) -> function start candidates: %s\n" % (
                              site, mode, kind, " ".join("0x%08x" % a for a in st)))
                      if not ctor.get(V):
                          fh.write("   (no pc-relative load of the vtable pointer found)\n")
                      fh.write("\n")
                  fh.write("== other references to the typeinfo objects (not a vtable header)\n")
                  for T, c2, prev in other:
                      s = img.cstr(prev, 300) if img.v2o(prev) is not None else None
                      sd = s.decode() if s and PRINTABLE.match(s) else ""
                      fh.write("   typeinfo 0x%08x referenced by word at 0x%08x (previous word 0x%08x %s)\n" % (
                          T, c2, prev, ("-> '%s' (derived typeinfo base pointer?)" % sd[:160]) if sd else ""))
                  fh.write("\nname strings without a typeinfo: %s\n" % (
                      " ".join("%08x" % n for n in sorted(names) if n not in set(tinfo.values())) or "none"))

              # ---- decompile candidates for Ghidra (priority: operator() bodies, builders, other slots)
              rows, seen_start = [], set()

              def add(name, mode, site, start, string):
                  if len(rows) >= MAX_CAND or (start in seen_start):
                      return
                  seen_start.add(start)
                  rows.append("%s\t%s\t0x%08x\t0x%08x\t0x%08x\t0x%08x" % (name, mode, site, start, string, string))

              def tag(idx, ident):
                  return "RTTI%d_%s" % (idx, re.sub(r"[^A-Za-z0-9]", "", ident)[:28])

              for idx, T, nva, V, slots in vt:
                  if len(slots) > 6:
                      a = slots[6]
                      add(tag(idx, names[nva][1]) + "_slot6", "T" if a & 1 else "A", a & ~1, a & ~1, V)
              for idx, T, nva, V, slots in vt:
                  for mode, site, st, kind in ctor.get(V, []):
                      for a in st[:2]:
                          add(tag(idx, names[nva][1]) + "_builder", mode, site, a, V)
              for idx, T, nva, V, slots in vt:
                  for k, a in enumerate(slots):
                      if k in (2, 3):
                          add(tag(idx, names[nva][1]) + "_slot%d" % k, "T" if a & 1 else "A", a & ~1, a & ~1, V)
              with open(os.path.join(outdir, "rtti_candidates.tsv"), "w") as fc:
                  fc.write("name\tmode\tsite\tstart\tstring\ttarget\n")
                  fc.write("\n".join(rows) + ("\n" if rows else ""))
              print("decompile candidates written: %d" % len(rows))


          if __name__ == "__main__":
              main()
          MCRE_EOF
          cat > work/DecompileCandidates.java <<'MCRE_EOF'
          //Decompiles function-start candidates produced by xref_scan.py (no whole-program analysis).
          //A result is CONFIRMED only if the decompiled code really contains the string's (or cell's) address.
          //Args: <outDir> <candidates.tsv>
          //@category MCRE

          import java.io.File;
          import java.io.FileWriter;
          import java.io.PrintWriter;
          import java.math.BigInteger;
          import java.nio.file.Files;
          import java.nio.file.Paths;
          import java.util.ArrayList;
          import java.util.HashMap;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Map;
          import java.util.Set;

          import ghidra.app.decompiler.DecompInterface;
          import ghidra.app.decompiler.DecompileOptions;
          import ghidra.app.decompiler.DecompileResults;
          import ghidra.app.script.GhidraScript;
          import ghidra.program.model.address.Address;
          import ghidra.program.model.lang.Register;
          import ghidra.program.model.listing.Function;
          import ghidra.program.model.listing.Instruction;
          import ghidra.program.model.listing.InstructionIterator;
          import ghidra.program.model.listing.ProgramContext;

          public class DecompileCandidates extends GhidraScript {

              private static final int MAX_C_LINES = 3000;
              private static final int MAX_INSNS = 120;
              private static final long TIME_BUDGET_MS = 50L * 60L * 1000L;
              private static final int CLEAR_BEFORE = 0x40;
              private static final int CLEAR_AFTER = 0x5000;

              private void clearAround(Address start) throws Exception {
                  // wipes any earlier (possibly misaligned) disassembly, functions and Thumb/ARM context here
                  clearListing(start.subtract(CLEAR_BEFORE), start.add(CLEAR_AFTER));
              }

              @Override
              public void run() throws Exception {
                  String[] args = getScriptArgs();
                  File outDir = new File(args[0]);
                  outDir.mkdirs();

                  List<String[]> rows = new ArrayList<>();
                  boolean first = true;
                  for (String line : Files.readAllLines(Paths.get(args[1]))) {
                      if (first) { first = false; continue; }          // header
                      if (line.trim().isEmpty()) continue;
                      rows.add(line.split("\t"));                      // name mode site start string
                  }
                  println("candidates: " + rows.size());

                  Address base = currentProgram.getImageBase();
                  long baseOff = base.getOffset();
                  ProgramContext ctx = currentProgram.getProgramContext();
                  Register tmode = currentProgram.getRegister("TMode");

                  DecompInterface di = new DecompInterface();
                  di.setOptions(new DecompileOptions());
                  di.openProgram(currentProgram);

                  PrintWriter index = new PrintWriter(new FileWriter(new File(outDir, "decompiled_index.tsv")));
                  index.println("name\tmode\tsite\tstart\tcontains_site\tconfirmed\tsize\tfile");

                  Set<String> confirmedSites = new HashSet<>();
                  Map<Long, String> textByStart = new HashMap<>();
                  Map<Long, String> fileByStart = new HashMap<>();
                  long t0 = System.currentTimeMillis();
                  int written = 0;

                  for (String[] r : rows) {
                      if (monitor.isCancelled()) break;
                      if (System.currentTimeMillis() - t0 > TIME_BUDGET_MS) { println("time budget reached"); break; }
                      if (r.length < 5) continue;
                      String name = r[0], mode = r[1];
                      long siteV = Long.parseLong(r[2].replace("0x", ""), 16);
                      long startV = Long.parseLong(r[3].replace("0x", ""), 16);
                      long strV = Long.parseLong(r[4].replace("0x", ""), 16);

                      String siteKey = name + "|" + siteV;
                      if (confirmedSites.contains(siteKey)) continue;

                      String probe = String.format("%08x", strV + baseOff);

                      // function already decompiled for another target: just test this string against its text
                      if (textByStart.containsKey(startV)) {
                          boolean conf = textByStart.get(startV).contains(probe);
                          index.printf("%s\t%s\t0x%08x\t0x%08x\ttrue\t%b\t-\t%s%n", name, mode, siteV, startV, conf,
                                       fileByStart.get(startV));
                          if (conf) confirmedSites.add(siteKey);
                          continue;
                      }

                      Address startA = base.add(startV);
                      Address siteA = base.add(siteV);
                      try {
                          clearAround(startA);
                          if (tmode != null) {
                              ctx.setValue(tmode, startA, startA, BigInteger.valueOf(mode.equals("T") ? 1 : 0));
                          }
                          disassemble(startA);
                          Function f = getFunctionAt(startA);
                          if (f == null) f = createFunction(startA, null);
                          if (f == null) {
                              index.printf("%s\t%s\t0x%08x\t0x%08x\tno_function\tfalse\t0\t-%n", name, mode, siteV, startV);
                              continue;
                          }
                          boolean contains = f.getBody().contains(siteA);
                          long size = f.getBody().getNumAddresses();
                          if (!contains) {
                              index.printf("%s\t%s\t0x%08x\t0x%08x\tfalse\tfalse\t%d\t-%n", name, mode, siteV, startV, size);
                              continue;
                          }

                          String full = "";
                          String errMsg = null;
                          try {
                              DecompileResults res = di.decompileFunction(f, 60, monitor);
                              if (res != null && res.decompileCompleted()) {
                                  full = res.getDecompiledFunction().getC();
                              } else {
                                  errMsg = (res == null ? "null" : res.getErrorMessage());
                              }
                          } catch (Exception ex) {
                              errMsg = "decompile exception: " + ex.getMessage();
                          }
                          String lower = full.toLowerCase();
                          boolean confirmed = lower.contains(probe);

                          String safe = name.replaceAll("[^A-Za-z0-9_]+", "_");
                          String fname = String.format("dec_%s_%08x%s.txt", safe, startV, confirmed ? "" : "_unconfirmed");
                          textByStart.put(startV, lower);
                          fileByStart.put(startV, fname);
                          index.printf("%s\t%s\t0x%08x\t0x%08x\ttrue\t%b\t%d\t%s%n", name, mode, siteV, startV, confirmed, size, fname);
                          if (confirmed) confirmedSites.add(siteKey);

                          PrintWriter w = new PrintWriter(new FileWriter(new File(outDir, fname)));
                          w.printf("target: %s%n", name);
                          w.printf("confirmed (decompile contains string address 0x%s): %b%n", probe, confirmed);
                          w.printf("mode: %s (T = Thumb: hook address must have bit0 set)   start: 0x%08x   hook_addr: 0x%08x   size: %d%n",
                                   mode, startV, mode.equals("T") ? (startV | 1) : startV, size);
                          w.printf("string reference at: 0x%08x   string: %s%n", siteV, r[4]);
                          try {
                              byte[] b = new byte[64];
                              int got = currentProgram.getMemory().getBytes(startA, b);
                              StringBuilder sb = new StringBuilder();
                              for (int i = 0; i < got; i++) sb.append(String.format("%02X ", b[i]));
                              w.println("first bytes: " + sb.toString().trim());
                          } catch (Exception ex) {
                              w.println("bytes failed: " + ex.getMessage());
                          }
                          w.println();
                          w.println("---- first instructions (addresses shown as file offsets) ----");
                          InstructionIterator it = currentProgram.getListing().getInstructions(f.getBody(), true);
                          int n = 0;
                          while (it.hasNext() && n++ < MAX_INSNS) {
                              Instruction ins = it.next();
                              w.printf("%08x: %s%n", ins.getAddress().subtract(base), ins.toString());
                          }
                          w.println();
                          w.println("---- decompiled (Ghidra addresses = file offset + 0x" + Long.toHexString(baseOff) + ") ----");
                          if (errMsg != null) {
                              w.println("decompile failed: " + errMsg);
                          } else {
                              String[] lines = full.split("\n");
                              for (int i = 0; i < lines.length && i < MAX_C_LINES; i++) w.println(lines[i]);
                              if (lines.length > MAX_C_LINES) w.println("... (" + (lines.length - MAX_C_LINES) + " more lines)");
                          }
                          w.close();
                          written++;
                          println((confirmed ? "CONFIRMED: " : "unconfirmed: ") + name + " @ 0x" + Long.toHexString(startV));
                      } catch (Exception ex) {
                          index.printf("%s\t%s\t0x%08x\t0x%08x\terror\tfalse\t0\t%s%n", name, mode, siteV, startV,
                                       String.valueOf(ex.getMessage()).replace('\t', ' ').replace('\n', ' '));
                      }
                  }
                  index.close();
                  di.dispose();
                  println("done, files written: " + written);
              }
          }
          MCRE_EOF
          cat > work/strings_map.sh <<'MCRE_EOF'
          #!/usr/bin/env bash
          # Builds small, useful text files from the strings embedded in the library.
          set -u
          LIB="$1"; OUT="$2"; mkdir -p "$OUT"
          TMP="$(mktemp)"

          {
            echo "== file ==";          file "$LIB"
            echo "== size ==";          ls -la "$LIB"
            echo "== elf header ==";    readelf -h "$LIB" | grep -E "Class|Machine|Type|Entry"
            echo "== build id ==";      readelf -n "$LIB" | grep -i "build id"
            echo "== load segments =="; readelf -lW "$LIB" | grep -E "LOAD"
          } > "$OUT/info.txt" 2>&1

          strings -a -t x -n 6 "$LIB" > "$TMP"

          # Source files the game was built from (a map of the code base)
          grep -oE "handheld/[A-Za-z0-9_./-]+\.(cpp|h|hpp)" "$TMP" | sort -u > "$OUT/source_files.txt"
          sed 's|/[^/]*$||' "$OUT/source_files.txt" | sort | uniq -c | sort -rn > "$OUT/source_dirs.txt"

          # Readable function names (compiler-embedded) related to rendering
          grep -E "::[A-Za-z_~0-9<>]+\(" "$TMP" \
            | grep -iE "render|particle|cull|frustum|visib|occlu|chunk|mesh|draw|lod|fog|weather|cloud|sky|shadow|entity|actor|animat|batch" \
            > "$OUT/render_funcs.txt"

          {
            echo "source files:  $(wc -l < "$OUT/source_files.txt")"
            echo "render funcs:  $(wc -l < "$OUT/render_funcs.txt")"
          } > "$OUT/counts.txt"
          rm -f "$TMP"
          cat "$OUT/info.txt" "$OUT/counts.txt"
