name: build-fpsboost

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Write mod source
        run: |
          mkdir -p mod out
          cat > mod/fpsboost.c <<'FPSBOOST_EOF'
          /*
           * FpsBoost 1.3 - LeviLauncher native mod, 32-bit ARM (armeabi-v7a)
           *
           * One source, four builds (define exactly one):
           *   -DFB_OFF      libfpsboost_off.so      does nothing at all (baseline)
           *   -DFB_EXP      libfpsboost.so          worker-thread experiment
           *   -DFB_MEASURE  libfpsboost_measure.so  read-only thread/core report + sampling profiler (diagnostics only)
           *   -DFB_CULL     libfpsboost_cull.so     the EXP thread move PLUS two hooks (see below)
           *
           * OFF / EXP / MEASURE: no hooks, no signals, no GL, no work on the game's MAIN or
           * render thread. They only run ONE low-priority background thread that reads /proc/self/task.
           *
           * CULL hooks (only for game build-id 03222634..., each place is also checked byte by byte):
           *   entity cull : the per-actor render-queue callback of LevelRendererCamera::queueRenderEntities.
           *                 Actors farther than entity_blocks from the camera are not queued for drawing.
           *   chunk pace  : LevelBuilder::scheduleChunkBuild. After chunk_budget builds in one frame, chunks
           *                 farther than chunk_near blocks are left for the next frame (the game already
           *                 re-requests unbuilt chunks; this is the same 'not now' answer it gives itself).
           *
           * EXP: threads named "Thread-<N>" that have used >= min_cpu_ms of CPU are
           * moved to the slow cores with a higher nice value. MINECRAFT MAIN and
           * Rendering Pool are never touched. Nothing is pinned unless the CPU has a
           * clearly faster set of >= 3 cores AND at least one slower core.
           *
           * Optional FpsBoost.cfg (key=value, '#' comments), looked up in
           *   /sdcard/Android/media/<pkg>/   then   /sdcard/Android/data/<pkg>/files/
           *   nice=4          EXP: nice added to moved workers (1..19)
           *   min_cpu_ms=500  EXP: CPU time a Thread-N needs before it is moved
           *   poll_ms=3000    EXP: scan interval
           *   log=1           0 = create/write no log file at all
           *   report_s=30     MEASURE: seconds between reports
           *   prof=1          MEASURE: 0 = no profiler, thread report only
           *   prof_hz=400     MEASURE: samples per second of process CPU time (50..1000)
           *   threads=1       CULL: 0 = do not move worker threads
           *   hooks=1         CULL, read at start only: 0 = never install the hooks (thread move only)
           *   entity_cull=1   CULL: entity culling on/off - LIVE, the file is re-read every ~2 s while the game runs
           *   entity_blocks=64   CULL: entity draw distance in blocks (16..1024)
           *   chunk_pace=1    CULL: chunk pacing on/off - LIVE. Deleting the file = all defaults again.
           *   chunk_budget=4  CULL: far chunk builds started per frame (1..256); 1-2 smoothest, 8+ close to vanilla
           *   chunk_near=24   CULL: chunks closer than this many blocks are never held back (8..128)
           *   gap_us=3000     CULL: pause between calls that counts as a new frame (500..50000)
           *   stats_s=30      CULL: seconds between counter lines in the log (0 = never)
           */
          #define _GNU_SOURCE
          #include <stdbool.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <stdarg.h>
          #include <errno.h>
          #include <time.h>
          #include <unistd.h>
          #include <pthread.h>
          #include <sched.h>
          #include <dirent.h>
          #include <link.h>
          #include <dlfcn.h>
          #include <stdint.h>
          #include <signal.h>
          #include <ucontext.h>
          #include <sys/time.h>
          #include <sys/stat.h>
          #include <sys/types.h>
          #include <sys/resource.h>
          #include <sys/syscall.h>
          #include <sys/prctl.h>

          #if (defined(FB_OFF) + defined(FB_EXP) + defined(FB_MEASURE) + defined(FB_CULL)) != 1
          #error "define exactly one of FB_OFF, FB_EXP, FB_MEASURE, FB_CULL"
          #endif

          #define FB_VERSION "1.3"
          #define FB_EXPORT __attribute__((visibility("default")))

          #ifdef FB_OFF
          /* ------------------------------------------------------------------ OFF */
          FB_EXPORT bool PLMod_Load(void)    { return true; }
          FB_EXPORT bool PLMod_Enable(void)  { return true; }
          FB_EXPORT bool PLMod_Disable(void) { return true; }
          FB_EXPORT bool PLMod_Unload(void)  { return true; }
          FB_EXPORT bool LeviMod_Load(void)  { return true; }
          #else
          /* ------------------------------------------------ EXP / MEASURE / CULL */

          /* Overridable only so the host tests can use a fake /proc and /sys. */
          #ifndef FB_TASK_DIR
          #define FB_TASK_DIR "/proc/self/task"
          #endif
          #ifndef FB_CPU_DIR
          #define FB_CPU_DIR "/sys/devices/system/cpu"
          #endif
          #ifndef FB_CMDLINE
          #define FB_CMDLINE "/proc/self/cmdline"
          #endif
          #ifndef FB_GAME_LIB
          #define FB_GAME_LIB "libminecraftpe.so"
          #endif
          #ifndef FB_MEDIA_ROOT
          #define FB_MEDIA_ROOT "/sdcard/Android/media"
          #endif
          #ifndef FB_DATA_ROOT
          #define FB_DATA_ROOT "/sdcard/Android/data"
          #endif
          #ifndef FB_NCPU
          #define FB_NCPU() ((int)sysconf(_SC_NPROCESSORS_CONF))
          #endif

          #define MAXT   1024
          #define MAXCPU 32

          #if defined(FB_EXP) || defined(FB_CULL)
          #define FB_THREADS 1           /* the worker-thread experiment is part of this build */
          #endif
          #if defined(FB_EXP)
          #define FB_VARIANT "exp"
          #define FB_LOG_CAP 40          /* the exp build can never write more than this */
          #elif defined(FB_CULL)
          #define FB_VARIANT "cull"
          #define FB_LOG_CAP 60          /* the cull build can never write more than this */
          #else
          #define FB_VARIANT "measure"
          #define FB_LOG_CAP 0           /* 0 = no cap (one report every report_s) */
          #endif

          struct cfg { int nice, min_cpu_ms, poll_ms, log, report_s,
                       threads, entity_cull, entity_blocks, chunk_pace, chunk_budget, chunk_near, gap_us, stats_s, hooks,
                       prof, prof_hz; };
          #ifdef FB_CULL
          static const struct cfg g_cfg_default = { 4, 500, 3000, 1, 30,  1, 1, 64, 1, 4, 24, 3000, 30, 1,  1, 400 };
          #endif
          static struct cfg g_cfg = { 4, 500, 3000, 1, 30,  1, 1, 64, 1, 4, 24, 3000, 30, 1,  1, 400 };

          static volatile int g_stop;
          static volatile int g_active = 1;
          static int g_started;
          static pthread_t g_thr;
          static pthread_mutex_t g_mx = PTHREAD_MUTEX_INITIALIZER;

          static char g_pkg[96];
          static char g_dirs[2][200];
          static int  g_ndirs;
          static char g_logpath[512];
          static int  g_log_lines;

          /* ---------------------------------------------------------------- utils */
          #ifdef FB_MEASURE
          static long long now_ms(void) {
              struct timespec ts;
              clock_gettime(CLOCK_MONOTONIC, &ts);
              return (long long)ts.tv_sec * 1000 + ts.tv_nsec / 1000000;
          }
          #endif
          static void sleep_ms(int ms) {
              struct timespec ts;
              ts.tv_sec = ms / 1000;
              ts.tv_nsec = (long)(ms % 1000) * 1000000L;
              nanosleep(&ts, NULL);
          }
          static int clampi(long v, int lo, int hi) { return v < lo ? lo : (v > hi ? hi : (int)v); }

          __attribute__((format(printf, 1, 2)))
          static void flog(const char *fmt, ...) {
              if (!g_cfg.log || !g_logpath[0]) return;
              if (FB_LOG_CAP > 0 && g_log_lines >= FB_LOG_CAP) return;
              FILE *f = fopen(g_logpath, "a");
              if (!f) return;
              time_t t = time(NULL);
              struct tm tm;
              localtime_r(&t, &tm);
              fprintf(f, "[%02d:%02d:%02d] ", tm.tm_hour, tm.tm_min, tm.tm_sec);
              va_list ap;
              va_start(ap, fmt);
              vfprintf(f, fmt, ap);
              va_end(ap);
              fputc('\n', f);
              g_log_lines++;
              if (FB_LOG_CAP > 0 && g_log_lines >= FB_LOG_CAP)
                  fprintf(f, "[--:--:--] log cap (%d lines) reached, silent from here\n", FB_LOG_CAP);
              fclose(f);
          }

          static void init_paths(void) {
              char buf[96];
              size_t n = 0;
              FILE *f = fopen(FB_CMDLINE, "r");
              if (f) { n = fread(buf, 1, sizeof buf - 1, f); fclose(f); }
              buf[n] = 0;
              char *c = strchr(buf, ':');
              if (c) *c = 0;
              int ok = buf[0] != 0 && strchr(buf, '.') != NULL;
              for (const char *p = buf; ok && *p; p++)
                  if (!((*p >= 'a' && *p <= 'z') || (*p >= 'A' && *p <= 'Z') ||
                        (*p >= '0' && *p <= '9') || *p == '.' || *p == '_')) ok = 0;
              snprintf(g_pkg, sizeof g_pkg, "%s", ok ? buf : "org.levimc.launcher");
              snprintf(g_dirs[0], sizeof g_dirs[0], "%s/%s", FB_MEDIA_ROOT, g_pkg);
              snprintf(g_dirs[1], sizeof g_dirs[1], "%s/%s/files", FB_DATA_ROOT, g_pkg);
              g_ndirs = 2;
          }

          /* Only called when log=1: probes the dirs in order and remembers the first writable one. */
          static void choose_logpath(void) {
              g_logpath[0] = 0;
              for (int i = 0; i < g_ndirs && !g_logpath[0]; i++) {
                  if (i == 0) mkdir(g_dirs[0], 0775);
                  char p[512];
                  snprintf(p, sizeof p, "%s/FpsBoost.log", g_dirs[i]);
                  FILE *t = fopen(p, "a");
                  if (t) { fclose(t); snprintf(g_logpath, sizeof g_logpath, "%s", p); }
              }
          }

          static int load_cfg(char *used, size_t usedlen) {
              for (int d = 0; d < g_ndirs; d++) {
                  char p[512];
                  snprintf(p, sizeof p, "%s/FpsBoost.cfg", g_dirs[d]);
                  FILE *f = fopen(p, "r");
                  if (!f) continue;
                  char line[160];
                  while (fgets(line, sizeof line, f)) {
                      char *s = line;
                      while (*s == ' ' || *s == '\t') s++;
                      if (*s == '#' || *s == ';' || *s == '\n' || *s == '\r' || !*s) continue;
                      char *eq = strchr(s, '=');
                      if (!eq) continue;
                      *eq = 0;
                      char *k = s, *v = eq + 1;
                      for (char *e = k + strlen(k); e > k && (e[-1] == ' ' || e[-1] == '\t'); ) *--e = 0;
                      while (*v == ' ' || *v == '\t') v++;
                      long x = strtol(v, NULL, 10);
                      if      (!strcmp(k, "nice"))        g_cfg.nice       = clampi(x, 1, 19);
                      else if (!strcmp(k, "min_cpu_ms"))  g_cfg.min_cpu_ms = clampi(x, 0, 60000);
                      else if (!strcmp(k, "poll_ms"))     g_cfg.poll_ms    = clampi(x, 500, 30000);
                      else if (!strcmp(k, "log"))         g_cfg.log        = x != 0;
                      else if (!strcmp(k, "report_s"))    g_cfg.report_s   = clampi(x, 5, 600);
                      else if (!strcmp(k, "threads"))       g_cfg.threads       = x != 0;
                      else if (!strcmp(k, "hooks"))         g_cfg.hooks         = x != 0;
                      else if (!strcmp(k, "prof"))          g_cfg.prof          = x != 0;
                      else if (!strcmp(k, "prof_hz"))       g_cfg.prof_hz       = clampi(x, 50, 1000);
                      else if (!strcmp(k, "entity_cull"))   g_cfg.entity_cull   = x != 0;
                      else if (!strcmp(k, "entity_blocks")) g_cfg.entity_blocks = clampi(x, 16, 1024);
                      else if (!strcmp(k, "chunk_pace"))    g_cfg.chunk_pace    = x != 0;
                      else if (!strcmp(k, "chunk_budget"))  g_cfg.chunk_budget  = clampi(x, 1, 256);
                      else if (!strcmp(k, "chunk_near"))    g_cfg.chunk_near    = clampi(x, 8, 128);
                      else if (!strcmp(k, "gap_us"))        g_cfg.gap_us        = clampi(x, 500, 50000);
                      else if (!strcmp(k, "stats_s"))       g_cfg.stats_s       = clampi(x, 0, 3600);
                  }
                  fclose(f);
                  snprintf(used, usedlen, "%s", p);
                  return 1;
              }
              return 0;
          }

          /* ---------------------------------------------------------- core choice */
          struct cores {
              int n, ok, nfast, nslow;
              long khz[MAXCPU];
              cpu_set_t fast, slow;
              char why[96];
          };

          static void mask_str(const cpu_set_t *m, int n, char *out, size_t len) {
              size_t o = 0;
              int i = 0;
              out[0] = 0;
              while (i < n) {
                  if (!CPU_ISSET(i, m)) { i++; continue; }
                  int j = i;
                  while (j + 1 < n && CPU_ISSET(j + 1, m)) j++;
                  int w = (j > i) ? snprintf(out + o, len - o, "%s%d-%d", o ? "," : "", i, j)
                                  : snprintf(out + o, len - o, "%s%d", o ? "," : "", i);
                  if (w < 0 || (size_t)w >= len - o) break;
                  o += (size_t)w;
                  i = j + 1;
              }
              if (!o) snprintf(out, len, "-");
          }

          /* fast = cores >= 90% of the top max freq. Pin only if the cores clearly
           * differ (>10%), fast has >= 3 cores and there is >= 1 slower core.
           * Cores whose max freq is unreadable are ignored (in neither set). */
          static void pick_cores(struct cores *c) {
              memset(c, 0, sizeof *c);
              CPU_ZERO(&c->fast);
              CPU_ZERO(&c->slow);
              int n = FB_NCPU();
              if (n < 1) n = 1;
              if (n > MAXCPU) n = MAXCPU;
              c->n = n;
              long mx = 0, mn = 0;
              for (int i = 0; i < n; i++) {
                  char p[160];
                  snprintf(p, sizeof p, FB_CPU_DIR "/cpu%d/cpufreq/cpuinfo_max_freq", i);
                  FILE *f = fopen(p, "r");
                  long v = 0;
                  if (f) { if (fscanf(f, "%ld", &v) != 1) v = 0; fclose(f); }
                  if (v < 0) v = 0;
                  c->khz[i] = v;
                  if (v > mx) mx = v;
                  if (v > 0 && (mn == 0 || v < mn)) mn = v;
              }
              if (mx == 0) { snprintf(c->why, sizeof c->why, "max freq unreadable"); return; }
              if ((long long)(mx - mn) * 100 < (long long)mx * 10) {
                  snprintf(c->why, sizeof c->why, "cores look alike (%ld-%ld MHz)", mn / 1000, mx / 1000);
                  return;
              }
              for (int i = 0; i < n; i++) {
                  if (c->khz[i] <= 0) continue;
                  if ((long long)c->khz[i] * 100 >= (long long)mx * 90) { CPU_SET(i, &c->fast); c->nfast++; }
                  else                                                   { CPU_SET(i, &c->slow); c->nslow++; }
              }
              if (c->nfast < 3) { snprintf(c->why, sizeof c->why, "fast set has %d cores (need >= 3)", c->nfast); return; }
              if (c->nslow < 1) { snprintf(c->why, sizeof c->why, "no slower cores"); return; }
              c->ok = 1;
          }

          /* -------------------------------------------------------------- threads */
          struct thr { int tid; int cpu; unsigned long long ticks; char name[20]; };

          static int read_thr(int tid, struct thr *t) {
              char path[96], buf[1024];
              snprintf(path, sizeof path, FB_TASK_DIR "/%d/stat", tid);
              FILE *f = fopen(path, "r");
              if (!f) return 0;
              size_t n = fread(buf, 1, sizeof buf - 1, f);
              fclose(f);
              buf[n] = 0;
              char *lp = strchr(buf, '('), *rp = strrchr(buf, ')');
              if (!lp || !rp || rp < lp) return 0;
              size_t nl = (size_t)(rp - lp - 1);
              if (nl >= sizeof t->name) nl = sizeof t->name - 1;
              memcpy(t->name, lp + 1, nl);
              t->name[nl] = 0;
              /* fields after ")": 3=state ... 14=utime 15=stime ... 39=processor */
              char *p = rp + 1;
              int field = 3, have = 0;
              unsigned long long ut = 0, st = 0;
              t->cpu = -1;
              while (*p) {
                  while (*p == ' ') p++;
                  if (!*p || *p == '\n') break;
                  char *e = p;
                  while (*e && *e != ' ' && *e != '\n') e++;
                  if (field == 14)      { ut = strtoull(p, NULL, 10); have |= 1; }
                  else if (field == 15) { st = strtoull(p, NULL, 10); have |= 2; }
                  else if (field == 39) { t->cpu = atoi(p); break; }
                  field++;
                  p = e;
              }
              if (have != 3) return 0;
              t->tid = tid;
              t->ticks = ut + st;
              return 1;
          }

          static int snapshot(struct thr *out, int max) {
              DIR *d = opendir(FB_TASK_DIR);
              if (!d) return 0;
              int n = 0;
              struct dirent *e;
              while (n < max && (e = readdir(d)) != NULL) {
                  if (e->d_name[0] < '0' || e->d_name[0] > '9') continue;
                  if (read_thr(atoi(e->d_name), &out[n])) n++;
              }
              closedir(d);
              return n;
          }

          static int phdr_cb(struct dl_phdr_info *i, size_t sz, void *d) {
              (void)sz;
              if (i->dlpi_name && strstr(i->dlpi_name, FB_GAME_LIB)) { *(int *)d = 1; return 1; }
              return 0;
          }
          static int game_loaded(void) {
              static int found;
              if (found) return 1;
              int f = 0;
              dl_iterate_phdr(phdr_cb, &f);
              if (f) found = 1;
              return found;
          }

          /* ------------------------------------------------------------------ EXP */
          #ifdef FB_THREADS
          static int is_worker_name(const char *s) {
              if (strncmp(s, "Thread-", 7) != 0) return 0;
              s += 7;
              if (!*s) return 0;
              for (; *s; s++) if (*s < '0' || *s > '9') return 0;
              return 1;
          }

          static int g_done[MAXT];
          static unsigned char g_seen[MAXT];
          static int g_ndone;

          /* One scan. Returns how many threads were moved in this pass. */
          static int exp_scan(const cpu_set_t *slow, int self) {
              static struct thr cur[MAXT];
              long hz = sysconf(_SC_CLK_TCK);
              if (hz < 1) hz = 100;
              int n = snapshot(cur, MAXT), moved = 0;
              memset(g_seen, 0, sizeof g_seen);
              for (int i = 0; i < n; i++) {
                  struct thr *t = &cur[i];
                  int j = 0;
                  while (j < g_ndone && g_done[j] != t->tid) j++;
                  if (j < g_ndone) { g_seen[j] = 1; continue; }
                  if (t->tid == self || !is_worker_name(t->name)) continue;
                  long long ms = (long long)(t->ticks * 1000ULL / (unsigned long long)hz);
                  if (ms < g_cfg.min_cpu_ms) continue;
                  int a = sched_setaffinity((pid_t)t->tid, sizeof *slow, slow);
                  int ae = a ? errno : 0;
                  int p = setpriority(PRIO_PROCESS, (id_t)t->tid, g_cfg.nice);
                  int pe = p ? errno : 0;
                  if (g_ndone < MAXT) { g_done[g_ndone] = t->tid; g_seen[g_ndone] = 1; g_ndone++; }
                  moved++;
                  flog("moved %s/%d (%lld ms CPU so far): affinity %s, nice %s", t->name, t->tid, ms,
                       a ? "FAILED" : "ok", p ? "FAILED" : "ok");
                  if (a || p) flog("  errno: affinity=%d nice=%d", ae, pe);
              }
              int k = 0;                              /* forget threads that are gone */
              for (int j = 0; j < g_ndone; j++)
                  if (g_seen[j]) g_done[k++] = g_done[j];
              g_ndone = k;
              return moved;
          }
          #endif

          /* bounded printf-append: never writes past the buffer */
          #ifdef FB_MEASURE
          static void sappend(char *buf, size_t sz, size_t *len, const char *fmt, ...) {
              if (*len >= sz - 1) return;
              va_list ap;
              va_start(ap, fmt);
              int w = vsnprintf(buf + *len, sz - *len, fmt, ap);
              va_end(ap);
              if (w < 0) return;
              size_t room = sz - *len - 1;
              *len += (size_t)w < room ? (size_t)w : room;
          }
          #endif

          #if defined(FB_CULL) || defined(FB_MEASURE)
          struct gameinfo { int found; uintptr_t base, end; char build_id[96]; };

          static int gi_cb(struct dl_phdr_info *info, size_t sz, void *data) {
              (void)sz;
              struct gameinfo *g = (struct gameinfo *)data;
              if (!info->dlpi_name || !strstr(info->dlpi_name, FB_GAME_LIB)) return 0;
              g->found = 1;
              g->base = (uintptr_t)info->dlpi_addr;
              for (int i = 0; i < info->dlpi_phnum; i++) {
                  const ElfW(Phdr) *ph = &info->dlpi_phdr[i];
                  if (ph->p_type == PT_LOAD) {
                      uintptr_t e = (uintptr_t)info->dlpi_addr + ph->p_vaddr + ph->p_memsz;
                      if (e > g->end) g->end = e;
                  }
                  if (ph->p_type != PT_NOTE || ph->p_memsz == 0 || ph->p_memsz > 4096) continue;
                  const uint8_t *p = (const uint8_t *)(info->dlpi_addr + ph->p_vaddr);
                  size_t off = 0, len = ph->p_memsz;
                  while (off + 12 <= len) {
                      uint32_t namesz = *(const uint32_t *)(p + off), descsz = *(const uint32_t *)(p + off + 4);
                      uint32_t type = *(const uint32_t *)(p + off + 8);
                      size_t noff = off + 12, doff = noff + ((namesz + 3u) & ~3u), next = doff + ((descsz + 3u) & ~3u);
                      if (next > len) break;
                      if (type == 3 && namesz == 4 && memcmp(p + noff, "GNU", 4) == 0 && descsz * 2 + 1 < sizeof g->build_id)
                          for (uint32_t j = 0; j < descsz; j++) snprintf(g->build_id + j * 2, 3, "%02x", p[doff + j]);
                      off = next;
                  }
              }
              return 1;
          }
          #ifndef FB_FIND_GAME
          static int find_game(struct gameinfo *g) {
              memset(g, 0, sizeof *g);
              dl_iterate_phdr(gi_cb, g);
              return g->found;
          }
          #define FB_FIND_GAME(g) find_game(g)
          #endif
          #endif

          /* -------------------------------------------------------------- MEASURE */
          #ifdef FB_MEASURE
          struct row { int tid, pct10, cpu; char name[20]; };
          static struct thr g_prev[MAXT];
          static int g_nprev;
          static long long g_prev_ms;

          static int cmp_row(const void *a, const void *b) {
              return ((const struct row *)b)->pct10 - ((const struct row *)a)->pct10;
          }

          static void measure_tick(const struct cores *cs, int self) {
              static struct thr cur[MAXT];
              static struct row rows[MAXT];
              long hz = sysconf(_SC_CLK_TCK);
              if (hz < 1) hz = 100;
              long long t = now_ms();
              int n = snapshot(cur, MAXT);
              if (g_prev_ms > 0 && t > g_prev_ms) {
                  long long dt = t - g_prev_ms;
                  int nr = 0;
                  long long total = 0, fastp = 0, slowp = 0;
                  for (int i = 0; i < n; i++) {
                      if (cur[i].tid == self) continue;
                      unsigned long long d = cur[i].ticks;
                      for (int j = 0; j < g_nprev; j++)
                          if (g_prev[j].tid == cur[i].tid) {
                              d = cur[i].ticks >= g_prev[j].ticks ? cur[i].ticks - g_prev[j].ticks : 0;
                              break;
                          }
                      long long dms = (long long)(d * 1000ULL / (unsigned long long)hz);
                      int pct10 = (int)(dms * 1000 / dt);
                      total += pct10;
                      if (cs->ok && cur[i].cpu >= 0 && cur[i].cpu < MAXCPU) {
                          if (CPU_ISSET(cur[i].cpu, &cs->fast)) fastp += pct10;
                          else if (CPU_ISSET(cur[i].cpu, &cs->slow)) slowp += pct10;
                      }
                      rows[nr].tid = cur[i].tid;
                      rows[nr].pct10 = pct10;
                      rows[nr].cpu = cur[i].cpu;
                      snprintf(rows[nr].name, sizeof rows[nr].name, "%s", cur[i].name);
                      nr++;
                  }
                  qsort(rows, (size_t)nr, sizeof rows[0], cmp_row);
                  char mhz[200] = "";
                  size_t o = 0;
                  for (int i = 0; i < cs->n && o + 12 < sizeof mhz; i++) {
                      char p[160];
                      snprintf(p, sizeof p, FB_CPU_DIR "/cpu%d/cpufreq/scaling_cur_freq", i);
                      FILE *f = fopen(p, "r");
                      long v = -1;
                      if (f) { if (fscanf(f, "%ld", &v) != 1) v = -1; fclose(f); }
                      int w = v >= 0 ? snprintf(mhz + o, sizeof mhz - o, " %ld", v / 1000)
                                     : snprintf(mhz + o, sizeof mhz - o, " ?");
                      if (w > 0) o += (size_t)w;
                  }
                  flog("MEASURE %lld.%lld s | %d threads | process %lld.%lld cores | by last cpu: fast %lld.%lld slow %lld.%lld (approx) | cur MHz:%s",
                       dt / 1000, (dt % 1000) / 100, nr, total / 1000, (total / 100) % 10,
                       fastp / 1000, (fastp / 100) % 10, slowp / 1000, (slowp / 100) % 10, mhz);
                  for (int i = 0; i < nr && i < 16 && rows[i].pct10 >= 30; i++)
                      flog("  [%s] tid %d  %d.%d%%  last cpu %d", rows[i].name, rows[i].tid,
                           rows[i].pct10 / 10, rows[i].pct10 % 10, rows[i].cpu);
              }
              memcpy(g_prev, cur, (size_t)n * sizeof cur[0]);
              g_nprev = n;
              g_prev_ms = t;
          }

          /* ------------------------------------------------------ sampling profiler (MEASURE only) */
          #ifndef FB_MAPS_PATH
          #define FB_MAPS_PATH "/proc/self/maps"
          #endif
          #define PF_MAX     60000
          #define PF_DEPTH   6
          #define PF_MAXMAPS 8192

          struct pfs { uint32_t tid; uintptr_t pc, lr, ra[PF_DEPTH]; };
          struct mapr { uintptr_t lo, hi; };
          static struct pfs g_pf[PF_MAX];
          static volatile uint32_t g_pf_n;
          static volatile int g_pf_on;
          static struct mapr g_maps[2][PF_MAXMAPS];
          static volatile int g_maps_cur;
          static volatile int g_maps_n[2];
          static uintptr_t g_game_base, g_game_end;
          static unsigned g_pf_window;

          /* is [a, a+n) inside one readable+writable mapping?  (frame records only live on stacks) */
          __attribute__((no_sanitize("address")))
          static int mem_ok(uintptr_t a, size_t n) {
              int c = g_maps_cur, cnt = g_maps_n[c];
              const struct mapr *t = g_maps[c];
              int lo = 0, hi = cnt - 1, best = -1;
              while (lo <= hi) {
                  int mid = (lo + hi) / 2;
                  if (t[mid].lo <= a) { best = mid; lo = mid + 1; } else hi = mid - 1;
              }
              return best >= 0 && a + n >= a && a + n <= t[best].hi;
          }

          static void pf_refresh_maps(void) {
              FILE *f = fopen(FB_MAPS_PATH, "r");
              if (!f) return;
              int w = 1 - g_maps_cur, n = 0;
              char line[512];
              while (n < PF_MAXMAPS && fgets(line, sizeof line, f)) {
                  unsigned long lo, hi;
                  char perms[8];
                  if (sscanf(line, "%lx-%lx %7s", &lo, &hi, perms) != 3) continue;
                  if (perms[0] != 'r' || perms[1] != 'w') continue;
                  if (n && g_maps[w][n - 1].hi == lo) g_maps[w][n - 1].hi = hi;
                  else { g_maps[w][n].lo = lo; g_maps[w][n].hi = hi; n++; }
              }
              fclose(f);
              g_maps_n[w] = n;
              g_maps_cur = w;
          }

          /* follow the frame-pointer chain: [fp] = caller's fp, [fp+W] = return address into the caller.
           * Every step is bounds-checked against the mapping table, so a wrong guess just stops the walk. */
          __attribute__((no_sanitize("address")))
          static int pf_walk(uintptr_t fp, uintptr_t sp, uintptr_t *out, int max) {
              int n = 0;
              uintptr_t last = sp;
              while (n < max) {
                  if ((fp & (sizeof(void *) - 1)) || fp < last || !mem_ok(fp, 2 * sizeof(void *))) break;
                  const uintptr_t *fr = (const uintptr_t *)fp;
                  uintptr_t nfp = fr[0], ra = fr[1];
                  out[n++] = ra;
                  if (nfp <= fp) break;
                  last = fp + 2 * sizeof(void *);
                  fp = nfp;
              }
              return n;
          }

          __attribute__((no_sanitize("address")))
          static void pf_handler(int sig, siginfo_t *si, void *ctx) {
              (void)sig; (void)si;
              if (!g_pf_on) return;
              uint32_t i = __atomic_fetch_add(&g_pf_n, 1, __ATOMIC_RELAXED);
              if (i >= PF_MAX) return;
              struct pfs *s = &g_pf[i];
              const ucontext_t *uc = (const ucontext_t *)ctx;
              uintptr_t fp = 0, sp = 0;
          #if defined(__arm__)
              s->pc = (uintptr_t)uc->uc_mcontext.arm_pc;
              s->lr = (uintptr_t)uc->uc_mcontext.arm_lr;
              fp = (uintptr_t)uc->uc_mcontext.arm_r7;            /* r7 is the frame pointer in Thumb code */
              sp = (uintptr_t)uc->uc_mcontext.arm_sp;
          #elif defined(__x86_64__)
              s->pc = (uintptr_t)uc->uc_mcontext.gregs[REG_RIP];
              s->lr = 0;
              fp = (uintptr_t)uc->uc_mcontext.gregs[REG_RBP];
              sp = (uintptr_t)uc->uc_mcontext.gregs[REG_RSP];
          #else
              (void)uc; s->pc = s->lr = 0;
          #endif
              s->tid = (uint32_t)syscall(__NR_gettid);
              for (int k = 0; k < PF_DEPTH; k++) s->ra[k] = 0;
              pf_walk(fp, sp, s->ra, PF_DEPTH);
          }

          static void pf_timer(int on) {
              struct itimerval it;
              memset(&it, 0, sizeof it);
              if (on) {
                  long us = 1000000L / g_cfg.prof_hz;
                  it.it_interval.tv_usec = us;
                  it.it_value.tv_usec = us;
              }
              setitimer(ITIMER_PROF, &it, NULL);
          }

          static void pf_start(void) {
              if (!g_cfg.prof || g_pf_on) return;
              struct gameinfo gi;
              if (!FB_FIND_GAME(&gi)) return;
              g_game_base = gi.base;
              g_game_end = gi.end;
              pf_refresh_maps();
              struct sigaction sa;
              memset(&sa, 0, sizeof sa);
              sa.sa_sigaction = pf_handler;
              sa.sa_flags = SA_SIGINFO | SA_RESTART;
              sigemptyset(&sa.sa_mask);
              if (sigaction(SIGPROF, &sa, NULL) != 0) { flog("profiler: sigaction failed"); return; }
              g_pf_n = 0;
              g_pf_on = 1;
              pf_timer(1);
              flog("profiler: %d samples/s of CPU time, game code at 0x%lx-0x%lx, report every %d s",
                   g_cfg.prof_hz, (unsigned long)g_game_base, (unsigned long)g_game_end, g_cfg.report_s);
          }

          static void pf_stop(void) {          /* the handler stays installed but ignores everything */
              if (g_pf_on) { pf_timer(0); g_pf_on = 0; }
          }

          /* start of the game function that contains pc (best guess: nearest 'push {..., lr}' before it) */
          static uintptr_t guess_func(uintptr_t pc) {
              pc &= ~(uintptr_t)1;
              if (pc < g_game_base || pc >= g_game_end) return 0;
          #if defined(__arm__)
              const uint16_t *lo = (const uint16_t *)g_game_base;
              for (int i = 0; i < 0x1800; i++) {
                  const uint16_t *q = (const uint16_t *)pc - i;
                  if (q < lo) break;
                  uint16_t h = q[0];
                  if ((h & 0xFF00) == 0xB500) return (uintptr_t)q;
                  if (h == 0xE92D && (q[1] & 0x4000)) return (uintptr_t)q;
              }
              return 0;
          #else
              Dl_info di;
              if (dladdr((void *)pc, &di) && di.dli_saddr) return (uintptr_t)di.dli_saddr;
              return 0;
          #endif
          }

          static int in_game(uintptr_t a) { a &= ~(uintptr_t)1; return a >= g_game_base && a < g_game_end; }

          /* the first game-code address on the call chain = the game function that is responsible for this sample */
          static uintptr_t pf_site(const struct pfs *s) {
              if (in_game(s->pc)) return guess_func(s->pc);
              if (s->lr && in_game(s->lr)) return guess_func(s->lr);
              for (int k = 0; k < PF_DEPTH; k++)
                  if (s->ra[k] && in_game(s->ra[k])) return guess_func(s->ra[k]);
              return 0;
          }

          struct pfrow { uintptr_t fn; uint32_t n; char key[72]; };
          #define PF_ROWS 512

          static void pf_key(uintptr_t pc, char *out, size_t sz) {
              Dl_info di;
              memset(&di, 0, sizeof di);
              snprintf(out, sz, "?");
              if (dladdr((void *)pc, &di) && di.dli_fname) {
                  const char *slash = strrchr(di.dli_fname, '/');
                  const char *lib = slash ? slash + 1 : di.dli_fname;
                  if (di.dli_sname && (uintptr_t)pc - (uintptr_t)di.dli_saddr < 0x1000) snprintf(out, sz, "%s:%s", lib, di.dli_sname);
                  else snprintf(out, sz, "%s:?", lib);
              }
          }

          static int pf_add(struct pfrow *rows, int *nrows, uintptr_t fn, const char *key) {
              for (int i = 0; i < *nrows; i++)
                  if (rows[i].fn == fn && strcmp(rows[i].key, key) == 0) { rows[i].n++; return 1; }
              if (*nrows >= PF_ROWS) return 0;
              rows[*nrows].fn = fn;
              rows[*nrows].n = 1;
              snprintf(rows[*nrows].key, sizeof rows[*nrows].key, "%s", key);
              (*nrows)++;
              return 1;
          }

          static int pf_top(const struct pfrow *rows, int n, int *used) {        /* index of the biggest unused row, -1 if none */
              int best = -1;
              for (int i = 0; i < n; i++)
                  if (!used[i] && (best < 0 || rows[i].n > rows[best].n)) best = i;
              if (best >= 0) used[best] = 1;
              return best;
          }

          static void pf_pct(char *out, size_t sz, uint32_t n, uint32_t total) {
              uint32_t t10 = total ? (uint32_t)((uint64_t)n * 1000 / total) : 0;
              snprintf(out, sz, "%u.%u%%", t10 / 10, t10 % 10);
          }

          static void pf_report(void) {
              if (!g_pf_on) return;
              static struct pfs snap[PF_MAX];
              static struct pfrow self_rows[PF_ROWS], ext_rows[PF_ROWS], key_rows[PF_ROWS];
              pf_refresh_maps();
              pf_timer(0);
              uint32_t n = g_pf_n;
              if (n > PF_MAX) n = PF_MAX;
              memcpy(snap, g_pf, (size_t)n * sizeof snap[0]);
              g_pf_n = 0;
              pf_timer(1);
              if (n < 20) return;
              g_pf_window++;

              struct { uint32_t tid, total; } th[64];
              int nth = 0;
              for (uint32_t i = 0; i < n; i++) {
                  int k = 0;
                  while (k < nth && th[k].tid != snap[i].tid) k++;
                  if (k == nth) { if (nth >= 64) continue; th[nth].tid = snap[i].tid; th[nth].total = 0; nth++; }
                  th[k].total++;
              }
              for (int a = 0; a < nth; a++)
                  for (int b = a + 1; b < nth; b++)
                      if (th[b].total > th[a].total) { uint32_t t0 = th[a].tid, t1 = th[a].total; th[a] = th[b]; th[b].tid = t0; th[b].total = t1; }
              flog("prof window %u: %u samples from %d threads", g_pf_window, n, nth);

              char tsvpath[512] = "";
              if (g_ndirs > 0) snprintf(tsvpath, sizeof tsvpath, "%s/profile.tsv", g_dirs[0]);
              FILE *tsv = g_cfg.log && tsvpath[0] ? fopen(tsvpath, "a") : NULL;

              for (int ti = 0; ti < nth && ti < 4; ti++) {
                  struct thr t;
                  char name[24];
                  if (read_thr((int)th[ti].tid, &t)) snprintf(name, sizeof name, "%s", t.name); else snprintf(name, sizeof name, "tid%u", th[ti].tid);
                  int ns = 0, ne = 0, nk = 0;
                  uint32_t game = 0, total = th[ti].total;
                  for (uint32_t i = 0; i < n; i++) {
                      const struct pfs *s = &snap[i];
                      if (s->tid != th[ti].tid) continue;
                      if (in_game(s->pc)) {
                          game++;
                          char key[8] = "game";
                          pf_add(self_rows, &ns, guess_func(s->pc), key);
                      } else {
                          char key[72];
                          pf_key(s->pc, key, sizeof key);
                          pf_add(key_rows, &nk, 0, key);
                          pf_add(ext_rows, &ne, pf_site(s), key);
                      }
                  }
                  char pg[16], pk[16];
                  pf_pct(pg, sizeof pg, game, total);
                  char line[900];
                  size_t len = 0;
                  line[0] = 0;
                  sappend(line, sizeof line, &len, "prof [%s/%u] %u samples, in game code %s, outside:", name, th[ti].tid, total, pg);
                  int used[PF_ROWS];
                  memset(used, 0, sizeof used);
                  for (int k = 0; k < 7; k++) {
                      int b = pf_top(key_rows, nk, used);
                      if (b < 0) break;
                      pf_pct(pk, sizeof pk, key_rows[b].n, total);
                      sappend(line, sizeof line, &len, " %s=%s", key_rows[b].key, pk);
                      if (tsv) fprintf(tsv, "%u\t%s\tout\t%s\t0\t%u\t%s\n", g_pf_window, name, key_rows[b].key, key_rows[b].n, pk);
                  }
                  flog("%s", line);

                  len = 0; line[0] = 0;
                  sappend(line, sizeof line, &len, "prof [%s] busiest game functions (rva=share):", name);
                  memset(used, 0, sizeof used);
                  for (int k = 0; k < 14; k++) {
                      int b = pf_top(self_rows, ns, used);
                      if (b < 0 || self_rows[b].n < 2) break;
                      pf_pct(pk, sizeof pk, self_rows[b].n, total);
                      sappend(line, sizeof line, &len, " 0x%x=%s", (unsigned)(self_rows[b].fn - g_game_base), pk);
                      if (tsv) fprintf(tsv, "%u\t%s\tgame\t-\t0x%x\t%u\t%s\n", g_pf_window, name, (unsigned)(self_rows[b].fn - g_game_base), self_rows[b].n, pk);
                  }
                  flog("%s", line);

                  len = 0; line[0] = 0;
                  sappend(line, sizeof line, &len, "prof [%s] outside-game time, by the game function that called it (what<-rva=share):", name);
                  memset(used, 0, sizeof used);
                  for (int k = 0; k < 12; k++) {
                      int b = pf_top(ext_rows, ne, used);
                      if (b < 0 || ext_rows[b].n < 3) break;
                      pf_pct(pk, sizeof pk, ext_rows[b].n, total);
                      sappend(line, sizeof line, &len, " %s<-0x%x=%s", ext_rows[b].key,
                              ext_rows[b].fn ? (unsigned)(ext_rows[b].fn - g_game_base) : 0u, pk);
                      if (tsv) fprintf(tsv, "%u\t%s\text\t%s\t0x%x\t%u\t%s\n", g_pf_window, name, ext_rows[b].key,
                                       ext_rows[b].fn ? (unsigned)(ext_rows[b].fn - g_game_base) : 0u, ext_rows[b].n, pk);
                  }
                  flog("%s", line);
              }
              if (tsv) fclose(tsv);
          }
          #endif

          /* ----------------------------------------------------------------- CULL */
          #ifdef FB_CULL
          #ifndef FB_NOW_US
          static long long now_us_real(void) {
              struct timespec ts;
              clock_gettime(CLOCK_MONOTONIC, &ts);
              return (long long)ts.tv_sec * 1000000LL + ts.tv_nsec / 1000;
          }
          #define FB_NOW_US() now_us_real()
          #endif

          /* The one game build this is written for, and the three places inside it (file offset == RVA).
           * Found by reading the decompiled game code; every place is compared byte by byte before use. */
          #define EXPECTED_BUILD_ID "03222634f9e4c1c061146770baa6872988e0a0fc"
          #define RVA_SCHED   0x074116d0u   /* LevelBuilder::scheduleChunkBuild(this, chunkInstance, const Vec3 *camPos, camera) -> 1 if a build was started */
          #define RVA_ACTOR   0x073f5d08u   /* queueRenderEntities per-actor callback: (functor *, Actor *)  - functor+0x10 = camera, camera+0x3cc = camera x,y,z */
          #define RVA_GETPOS  0x06787124u   /* veneer to the actor position getter: const float *(Actor *) */
          static const uint8_t PFX_SCHED[16]  = {0xF0,0xB5,0x03,0xAF,0x2D,0xE9,0x00,0x0F,0x81,0xB0,0x2D,0xED,0x06,0x8B,0xAD,0xF5};
          static const uint8_t PFX_ACTOR[16]  = {0xF0,0xB5,0x03,0xAF,0x2D,0xE9,0x00,0x0F,0x91,0xB0,0x05,0x46,0x8D,0x48,0x8B,0x46};
          static const uint8_t PFX_GETPOS[12] = {0x42,0xF2,0x77,0x5C,0xC0,0xF2,0x24,0x4C,0xFC,0x44,0x60,0x47};

          typedef int  (*pl_hook_fn)(void *target, void *detour, void **original, int priority);
          typedef void (*actor_fn)(void *self, void *actor);
          typedef int  (*sched_fn)(void *self, void *chunk, const float *cam, void *camera);
          typedef const float *(*getpos_fn)(void *actor);

          static pl_hook_fn g_pl_hook;
          static actor_fn   g_orig_actor;
          static sched_fn   g_orig_sched;
          static getpos_fn  g_getpos;
          static pthread_mutex_t g_hook_mx = PTHREAD_MUTEX_INITIALIZER;
          static int   g_hooks_state;                 /* 0 = not tried yet, 1 = done (installed or gave up for good) */
          static volatile int g_ent_on, g_pace_on;    /* installed: set only after pl_hook succeeded */
          static volatile int g_ent_enabled = 1, g_pace_enabled = 1;   /* live switches from the config file */
          static float g_ent_r2, g_near2;
          static int   g_budget;
          static long long g_gap_us;
          static long long g_last_us;
          static int   g_frame_built;
          static unsigned g_ent_seen, g_ent_culled, g_sc_calls, g_sc_built, g_sc_skipped;

          /* entity cull: skip the actor when it is farther than entity_blocks from the camera */
          static void det_actor(void *self, void *actor) {
              if (g_active && g_ent_on && g_ent_enabled) {
                  void *cam = *(void **)((char *)self + 0x10);
                  const float *ap = cam ? g_getpos(actor) : NULL;
                  if (ap) {
                      const float *cp = (const float *)((char *)cam + 0x3cc);
                      float dx = ap[0] - cp[0], dy = ap[1] - cp[1], dz = ap[2] - cp[2];
                      __atomic_fetch_add(&g_ent_seen, 1, __ATOMIC_RELAXED);
                      if (dx * dx + dy * dy + dz * dz > g_ent_r2) {      /* NaN compares false -> drawn as usual */
                          __atomic_fetch_add(&g_ent_culled, 1, __ATOMIC_RELAXED);
                          return;
                      }
                  }
              }
              if (g_orig_actor) g_orig_actor(self, actor);
          }

          /* chunk pace: after g_budget builds in one frame, far chunks wait for the next frame */
          static int det_sched(void *self, void *chunk, const float *cam, void *camera) {
              if (g_active && g_pace_on && g_pace_enabled && chunk && cam) {
                  long long t = FB_NOW_US();
                  if (t - g_last_us > g_gap_us) g_frame_built = 0;           /* a pause = a new frame */
                  g_last_us = t;
                  __atomic_fetch_add(&g_sc_calls, 1, __ATOMIC_RELAXED);
                  if (g_frame_built >= g_budget) {
                      const char *sh = *(const char *const *)((const char *)chunk + 0x10);   /* RenderChunkShared */
                      if (sh) {
                          const int *bp = (const int *)(sh + 0x14);                          /* chunk origin in blocks */
                          float dx = (float)(bp[0] + 8) - cam[0], dy = (float)(bp[1] + 8) - cam[1], dz = (float)(bp[2] + 8) - cam[2];
                          if (dx * dx + dy * dy + dz * dz >= g_near2) {
                              __atomic_fetch_add(&g_sc_skipped, 1, __ATOMIC_RELAXED);
                              return 0;                                              /* "nothing scheduled", like the game's own early exits */
                          }
                      }
                  }
              }
              if (!g_orig_sched) return 0;
              int r = g_orig_sched(self, chunk, cam, camera);
              if (r && g_pace_on) { g_frame_built++; __atomic_fetch_add(&g_sc_built, 1, __ATOMIC_RELAXED); }
              return r;
          }


          /* same lookup that worked in the earlier builds */
          static void resolve_preloader(void) {
              g_pl_hook = (pl_hook_fn)dlsym(RTLD_DEFAULT, "pl_hook");
              if (g_pl_hook) return;
              void *h = dlopen("libpreloader.so", RTLD_NOW | RTLD_NOLOAD);
              if (!h) {
                  FILE *f = fopen("/proc/self/maps", "r");
                  char line[512];
                  while (f && fgets(line, sizeof line, f)) {
                      if (!strstr(line, "libpreloader.so")) continue;
                      char *start = strchr(line, '/'), *nl = strchr(line, '\n');
                      if (start && nl) { *nl = 0; h = dlopen(start, RTLD_NOW | RTLD_NOLOAD); if (h) break; }
                  }
                  if (f) fclose(f);
              }
              if (h) g_pl_hook = (pl_hook_fn)dlsym(h, "pl_hook");
          }

          /* values the detours read; refreshed whenever the config file changes */
          static void apply_live(void) {
              g_ent_r2   = (float)g_cfg.entity_blocks * (float)g_cfg.entity_blocks;
              g_near2    = (float)g_cfg.chunk_near * (float)g_cfg.chunk_near;
              g_budget   = g_cfg.chunk_budget;
              g_gap_us   = g_cfg.gap_us;
              g_ent_enabled  = g_cfg.entity_cull;
              g_pace_enabled = g_cfg.chunk_pace;
          }

          /* size + modification time of the config file that load_cfg() would read (0 = none) */
          static long long g_cfg_stamp;
          static long long cfg_stamp(void) {
              for (int d = 0; d < g_ndirs; d++) {
                  char p[512];
                  struct stat st;
                  snprintf(p, sizeof p, "%s/FpsBoost.cfg", g_dirs[d]);
                  if (stat(p, &st) == 0)
                      return ((long long)st.st_mtim.tv_sec * 1000003LL + st.st_mtim.tv_nsec / 1000) * 31 + (long long)st.st_size + 1;
              }
              return 0;
          }

          /* called from the worker every ~2 s */
          static void cfg_reload_if_changed(void) {
              long long st = cfg_stamp();
              if (st == g_cfg_stamp) return;
              g_cfg_stamp = st;
              int keep_log = g_cfg.log;
              g_cfg = g_cfg_default;
              char used[512] = "";
              int have = st != 0 && load_cfg(used, sizeof used);
              if (!g_cfg.log && keep_log) { g_cfg.log = 1; flog("config reloaded: log=0 - the log goes quiet now"); g_cfg.log = 0; }
              apply_live();
              flog("config reloaded (%s): entity_cull=%d (%d blocks) chunk_pace=%d (budget %d, near %d)",
                   have ? used : "file removed, defaults", g_cfg.entity_cull, g_cfg.entity_blocks,
                   g_cfg.chunk_pace, g_cfg.chunk_budget, g_cfg.chunk_near);
          }

          static void install_hooks(uintptr_t base, const char *bid) {
              flog("game module base=0x%08lx build-id=%s", (unsigned long)base, bid[0] ? bid : "(unreadable)");
              if (bid[0] && strcmp(bid, EXPECTED_BUILD_ID) != 0) {
                  flog("UNSUPPORTED game build (expected %s) - no hook installed", EXPECTED_BUILD_ID);
                  return;
              }
              if (!g_cfg.hooks) { flog("hooks=0 in the config - no hook installed (thread move only)"); return; }
              apply_live();
              if (!g_pl_hook) resolve_preloader();
              if (!g_pl_hook) { flog("pl_hook not found in this process - no hook installed"); return; }

              {
                  if (memcmp((const void *)(base + RVA_ACTOR), PFX_ACTOR, sizeof PFX_ACTOR) != 0 ||
                      memcmp((const void *)(base + RVA_GETPOS), PFX_GETPOS, sizeof PFX_GETPOS) != 0) {
                      flog("entity cull SKIPPED: the game bytes at 0x%08x / 0x%08x are not what was analysed", RVA_ACTOR, RVA_GETPOS);
                  } else {
                      g_getpos = (getpos_fn)(base + RVA_GETPOS + 1u);                    /* +1 = Thumb */
                      int r = g_pl_hook((void *)(base + RVA_ACTOR + 1u), (void *)det_actor, (void **)&g_orig_actor, 200);
                      if (r == 0 && g_orig_actor) g_ent_on = 1;
                      flog("entity cull: hook ret=%d -> %s, currently %s (distance %d blocks)", r, g_ent_on ? "installed" : "NOT installed",
                           g_ent_enabled ? "ON" : "off", g_cfg.entity_blocks);
                  }
              }
              {
                  if (memcmp((const void *)(base + RVA_SCHED), PFX_SCHED, sizeof PFX_SCHED) != 0) {
                      flog("chunk pace SKIPPED: the game bytes at 0x%08x are not what was analysed", RVA_SCHED);
                  } else {
                      int r = g_pl_hook((void *)(base + RVA_SCHED + 1u), (void *)det_sched, (void **)&g_orig_sched, 200);
                      if (r == 0 && g_orig_sched) g_pace_on = 1;
                      flog("chunk pace: hook ret=%d -> %s, currently %s (%d far builds per frame, chunks within %d blocks never held back)",
                           r, g_pace_on ? "installed" : "NOT installed", g_pace_enabled ? "ON" : "off", g_cfg.chunk_budget, g_cfg.chunk_near);
                  }
              }
          }

          /* 1 = finished (installed or gave up for good), 0 = game library not loaded yet */
          static int try_install(void) {
              pthread_mutex_lock(&g_hook_mx);
              if (g_hooks_state) { pthread_mutex_unlock(&g_hook_mx); return 1; }
              struct gameinfo gi;
              if (!FB_FIND_GAME(&gi)) { pthread_mutex_unlock(&g_hook_mx); return 0; }
              g_hooks_state = 1;
              install_hooks(gi.base, gi.build_id);
              pthread_mutex_unlock(&g_hook_mx);
              return 1;
          }

          static void cull_stats(void) {
              static unsigned last[5];
              unsigned cur[5] = { g_ent_seen, g_ent_culled, g_sc_calls, g_sc_built, g_sc_skipped };
              if (!memcmp(last, cur, sizeof cur)) return;
              memcpy(last, cur, sizeof cur);
              flog("stats: entities seen %u culled %u | chunk-build calls %u started %u held back %u",
                   cur[0], cur[1], cur[2], cur[3], cur[4]);
          }
          #endif

          /* ----------------------------------------------------------- start-up + worker */
          static int g_inited;
          static struct cores g_cs;

          static void init_once(void) {
              if (g_inited) return;
              g_inited = 1;
              init_paths();
              char used[512] = "";
              int have_cfg = load_cfg(used, sizeof used);
              if (g_cfg.log) choose_logpath();
              pick_cores(&g_cs);
          #ifdef FB_CULL
              g_cfg_stamp = cfg_stamp();
              apply_live();
          #endif

              flog("=== FpsBoost %s (%s) pid %d ===", FB_VERSION, FB_VARIANT, (int)getpid());
              flog("config: %s", have_cfg ? used : "none, built-in defaults");
              {
                  char f[64], s[64];
                  mask_str(&g_cs.fast, g_cs.n, f, sizeof f);
                  mask_str(&g_cs.slow, g_cs.n, s, sizeof s);
                  if (g_cs.ok) flog("cores: fast %s (%d), slow %s (%d)", f, g_cs.nfast, s, g_cs.nslow);
                  else         flog("cores: not splitting (%s)", g_cs.why);
              }
          #ifdef FB_THREADS
              flog("threads: Thread-N with >= %d ms CPU -> slow cores, nice +%d, poll %d ms%s",
                   g_cfg.min_cpu_ms, g_cfg.nice, g_cfg.poll_ms,
          #ifdef FB_CULL
                   !g_cfg.threads ? " | OFF in the config" :
          #endif
                   g_cs.ok ? "" : " | DISABLED on this CPU");
          #else
              flog("measure: report every %d s, nothing is changed (profiler %s)", g_cfg.report_s, g_cfg.prof ? "on" : "off");
          #endif
          }

          static void *worker(void *arg) {
              (void)arg;
              prctl(PR_SET_NAME, "FpsBoost-bg", 0, 0, 0);
              int self = (int)syscall(__NR_gettid);
              setpriority(PRIO_PROCESS, (id_t)self, 19);

          #ifdef FB_THREADS
              int move_threads = g_cs.ok;
          #ifdef FB_CULL
              if (!g_cfg.threads) move_threads = 0;
          #endif
              if (move_threads) sched_setaffinity((pid_t)self, sizeof g_cs.slow, &g_cs.slow);   /* keep the helper off the fast cores */
              int interval = g_cfg.poll_ms;
          #else
              int interval = g_cfg.report_s * 1000;
          #endif

              const int tick = 100;
              int announced = 0, since_scan = interval, since_stats = 0, since_try = 1 << 20, since_cfg = 0, since_maps = 0;
              (void)since_stats; (void)since_try; (void)since_cfg; (void)since_maps;
              for (;;) {
                  sleep_ms(tick);
                  if (g_stop) break;
                  since_scan += tick; since_stats += tick; since_try += tick; since_cfg += tick; since_maps += tick;
                  if (!g_active) continue;
          #ifdef FB_CULL
                  if (since_cfg >= 2000) { since_cfg = 0; cfg_reload_if_changed(); }
          #endif
          #ifdef FB_CULL
                  if (!g_hooks_state && since_try >= 1000) { since_try = 0; try_install(); }
          #endif
                  if (!game_loaded()) continue;
                  if (!announced) {
                      announced = 1;
                      flog("game library present, running");
          #ifdef FB_MEASURE
                      pf_start();
          #endif
                  }
          #ifdef FB_MEASURE
                  if (since_maps >= 1000) { since_maps = 0; if (g_pf_on) pf_refresh_maps(); }   /* new threads = new stacks */
          #endif
                  if (since_scan >= interval) {
                      since_scan = 0;
          #ifdef FB_THREADS
                      if (move_threads) exp_scan(&g_cs.slow, self);
          #else
                      measure_tick(&g_cs, self);
                      pf_report();
          #endif
                  }
          #ifdef FB_CULL
                  if (g_cfg.stats_s > 0 && since_stats >= g_cfg.stats_s * 1000) { since_stats = 0; cull_stats(); }
          #endif
              }
              return NULL;
          }

          /* -------------------------------------------------------------- exports */
          static void stop_worker(void) {
              pthread_mutex_lock(&g_mx);
              if (g_started) { g_stop = 1; pthread_join(g_thr, NULL); g_started = 0; }
              pthread_mutex_unlock(&g_mx);
          }

          FB_EXPORT bool PLMod_Load(void) {
              pthread_mutex_lock(&g_mx);
              init_once();
              if (!g_started) {
                  g_stop = 0;
                  if (pthread_create(&g_thr, NULL, worker, NULL) == 0) g_started = 1;
              }
              pthread_mutex_unlock(&g_mx);
          #ifdef FB_CULL
              try_install();      /* the game library is normally loaded already: hook before it runs these paths */
          #endif
              return true;                      /* never fail the load, the game must start either way */
          }
          FB_EXPORT bool PLMod_Enable(void)  { g_active = 1; return true; }
          FB_EXPORT bool PLMod_Disable(void) { g_active = 0; return true; }   /* stops further work; hooks (if any) become pass-through */
          FB_EXPORT bool PLMod_Unload(void)  {
              g_active = 0;
          #ifdef FB_MEASURE
              pf_stop();
          #endif
              stop_worker();
              return true;
          }
          FB_EXPORT bool LeviMod_Load(void)  { return PLMod_Load(); }
          #endif
          FPSBOOST_EOF

      - name: Verify the source arrived intact
        run: |
          wc -l mod/fpsboost.c
          echo "b170a62d4cb07a170f1560a1a7ad8547eea5e97e52cc7a3c022529126f9c9eae  mod/fpsboost.c" | sha256sum -c - || { echo "Source was damaged when pasting build.yml - paste it again completely"; exit 1; }

      - name: Compile 4 variants (armeabi-v7a, API 21)
        run: |
          set -eu
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            NDK="$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | sort -V | tail -n 1)"
          fi
          [ -d "$NDK" ] || { echo "Android NDK not found on this runner"; exit 1; }
          echo "NDK: $NDK"
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CC="$BIN/armv7a-linux-androideabi21-clang"
          "$CC" --version | head -n 1
          if [ -x "$BIN/llvm-nm" ]; then NM="$BIN/llvm-nm"; else NM=nm; fi
          FLAGS="-shared -fPIC -O2 -Wall -Wextra -std=gnu11 -fvisibility=hidden -Wl,--build-id -Wl,-z,noexecstack -s"
          "$CC" $FLAGS -DFB_OFF     -o out/libfpsboost_off.so     mod/fpsboost.c
          "$CC" $FLAGS -DFB_EXP     -o out/libfpsboost.so         mod/fpsboost.c
          "$CC" $FLAGS -DFB_MEASURE -o out/libfpsboost_measure.so mod/fpsboost.c -ldl
          "$CC" $FLAGS -DFB_CULL    -o out/libfpsboost_cull.so    mod/fpsboost.c -ldl
          ls -la out

          for f in out/*.so; do
            echo "=== $f"
            readelf -h "$f" | grep -E "Class|Machine"
            readelf -h "$f" | grep -q "ELF32" || { echo "not a 32-bit ELF"; exit 1; }
            readelf -h "$f" | grep -q "ARM"   || { echo "not ARM"; exit 1; }
            "$NM" -D --defined-only "$f"
            for s in PLMod_Load PLMod_Enable PLMod_Disable PLMod_Unload; do
              "$NM" -D --defined-only "$f" | grep -qw "$s" || { echo "missing export $s"; exit 1; }
            done
            sha256sum "$f"
          done

          # Guarantees, checked on the real binaries:
          # the OFF build imports nothing that could do work,
          if "$NM" -D --undefined-only out/libfpsboost_off.so | grep -E "pthread_create|fopen|sched_setaffinity|setpriority|opendir|dlsym|dlopen"; then
            echo "OFF build is not empty"; exit 1
          fi
          # the MEASURE build cannot change affinity,
          if "$NM" -D --undefined-only out/libfpsboost_measure.so | grep -q "sched_setaffinity"; then
            echo "MEASURE build can change affinity"; exit 1
          fi
          # only the CULL build contains any hook code.
          for f in out/libfpsboost_off.so out/libfpsboost.so out/libfpsboost_measure.so; do
            if grep -aq "pl_hook" "$f"; then echo "$f contains hook code"; exit 1; fi
          done
          grep -aq "pl_hook" out/libfpsboost_cull.so || { echo "CULL build has no hook code"; exit 1; }
          # and only the MEASURE build uses signals / timers (the profiler).
          for f in out/libfpsboost_off.so out/libfpsboost.so out/libfpsboost_cull.so; do
            if "$NM" -D --undefined-only "$f" | grep -E "setitimer|sigaction"; then echo "$f uses signals"; exit 1; fi
          done
          "$NM" -D --undefined-only out/libfpsboost_measure.so | grep -q "setitimer" || { echo "MEASURE build has no profiler timer"; exit 1; }
          echo "checks passed"

      - name: Upload mods
        uses: actions/upload-artifact@v4
        with:
          name: fpsboost-1.3
          path: out/*.so
          if-no-files-found: error
